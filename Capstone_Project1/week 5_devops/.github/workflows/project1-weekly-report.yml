name: Project 1 - Weekly Attendance Report

on:
  schedule:
    - cron: "30 3 * * 1"     # every Monday 03:30 UTC = 09:00 IST
  workflow_dispatch:          # adds a "Run workflow" button for manual runs

permissions:
  contents: read

jobs:
  weekly-report:
    runs-on: ubuntu-latest
    steps:
      - name: Get the code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install packages
        run: pip install -r requirements.txt

      - name: Run attendance analysis
        working-directory: Capstone_Project1
        run: python weekly_attendance_report.py

      - name: Show summary on the run page
        run: cat Capstone_Project1/output/summary.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload report files
        uses: actions/upload-artifact@v4
        with:
          name: attendance-weekly-report
          path: Capstone_Project1/output/
